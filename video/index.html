<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Set up 1Password for Walleterm</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <script src="assets/voice/timings.js"></script>
    <script src="assets/scene.js"></script>
    <style>
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      #moon { position: absolute; left: 1450px; top: -260px; width: 760px; height: 760px; border-radius: 50%; background: var(--moon); }
      #hill { position: absolute; left: -200px; top: 900px; width: 1500px; height: 700px; border-radius: 50%; background: var(--moss); opacity: 0.22; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="69.32">
      <div id="moon" data-layout-allow-overflow></div>
      <div id="hill" data-layout-allow-overflow></div>
      <div id="s1" class="clip" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="3.34" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s2" class="clip" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="3.34" data-duration="8.52" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s3" class="clip" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="11.86" data-duration="5.56" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s4" class="clip" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="17.42" data-duration="12.68" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s5" class="clip" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="30.1" data-duration="8.72" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s6" class="clip" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="38.82" data-duration="13.52" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s7" class="clip" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="52.34" data-duration="13.04" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s8" class="clip" data-composition-id="s8" data-composition-src="compositions/s8.html" data-start="65.38" data-duration="3.94" data-track-index="1" data-width="1920" data-height="1080"></div>
      <audio id="voice" src="assets/voice/narration.mp3" data-start="0.6" data-duration="67.120" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#moon", { y: 0 }, { y: 40, duration: 69.32, ease: "sine.inOut" }, 0);
      tl.fromTo("#hill", { x: 0 }, { x: 60, duration: 69.32, ease: "sine.inOut" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
