[package]
name = "walleterm"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "Apache-2.0"
default-run = "walleterm"
description = "Stellar signing companion for agents using 1Password."

[dependencies]
stellar-xdr = { version = "=28.0.0", default-features = false, features = ["std", "base64"] }
stellar-strkey = { version = "=0.0.13", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "float_roundtrip"] }
libc = { version = "=0.2.189", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "process", "signal", "time", "sync", "io-util", "macros"] }
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["http1", "server", "client-legacy", "tokio"] }
hyper-tls = { version = "=0.6.0", default-features = false }
native-tls = { version = "=0.2.18", default-features = false }
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.5", default-features = false }
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
url = { version = "=2.5.8", default-features = false, features = ["std"] }
subtle = { version = "=2.6.1", default-features = false, features = ["std"] }
qrcode = { version = "=0.14.1", default-features = false }
tower-service = { version = "=0.3.3", default-features = false }

[build-dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[features]
default = []
# Builds only the walleterm-test-host binary for browser tests. Release packages never enable it.
test-host = []

[[bin]]
name = "walleterm"
path = "src/main.rs"

[[bin]]
name = "walleterm-test-host"
path = "src/bin/walleterm-test-host.rs"
required-features = ["test-host"]

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["test-util"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[workspace]
members = [".", "tools"]
default-members = ["."]
exclude = ["fixtures"]
resolver = "3"
