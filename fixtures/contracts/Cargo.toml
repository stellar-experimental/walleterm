[workspace]
resolver = "2"
members = ["simple-account", "auth-target"]

[workspace.dependencies]
# Same major as the pinned OpenZeppelin workspace (soroban-sdk 27.0.2 at a5bd8cbd).
soroban-sdk = "27.0.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
