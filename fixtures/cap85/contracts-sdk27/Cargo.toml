[workspace]
resolver = "2"
members = ["legacy-account"]

[workspace.dependencies]
# Protocol 27 SDK: this account predates CAP-85 and cannot decode ContractExecutable::ExternalRef.
soroban-sdk = "27.0.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
